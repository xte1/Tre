name: Run TikTok Zefoy Automator

on:
  schedule:
    # يعمل تلقائياً كل 6 ساعات (يمكنك تغيير الوقت حسب رغبتك)
    - cron: '0 */6 * * *'
  workflow_dispatch: # زر للتشغيل اليدوي متى ما أردت من تطبيق الجوال

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      run: |
        python tiktok.py
