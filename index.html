<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم تيك توك - @eyesiq</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #fff; padding: 20px; text-align: center; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #2c2c2c; color: #fff; }
        button { background: #ff3b5c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 95%; }
        button:hover { background: #e0324f; }
        #status { margin-top: 15px; color: #4cd137; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>تحكم بوت تيك توك</h2>
        <p>الحساب المستهدف: <b>@eyesiq</b></p>
        
        <input type="text" id="videoLink" placeholder="أدخل رابط الفيديو أو اليوزر هنا...">
        <br>
        <button onclick="saveLink()">توليد وحفظ ملف الرابط</button>
        
        <div id="status"></div>
    </div>

    <script>
        function saveLink() {
            const link = document.getElementById('videoLink').value;
            if(!link) {
                alert('الرجاء إدخال الرابط أولاً!');
                return;
            }
            
            const blob = new Blob([link], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'link.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            document.getElementById('status').innerText = 'تم تحميل ملف link.txt بنجاح! ضعه في مجلد السكريبت.';
        }
    </script>

</body>
</html>
