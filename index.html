<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث رابط تيك توك</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            text-align: left;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #b32d3d;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #d93848;
        }
        #status {
            margin-top: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="card">
    <h3>تحديث الرابط المستهدف</h3>
    
    <input type="password" id="githubToken" placeholder="GitHub Personal Access Token">
    <input type="text" id="targetLink" placeholder="الصق رابط الفيديو أو الصورة هنا">
    
    <button onclick="updateFile()">تحديث في المستودع فوراً</button>
    <div id="status"></div>
</div>

<script>
async function updateFile() {
    const token = document.getElementById('githubToken').value.trim();
    const content = document.getElementById('targetLink').value.trim();
    const statusDiv = document.getElementById('status');

    if (!token || !content) {
        statusDiv.style.color = '#ff6b6b';
        statusDiv.innerText = 'الرجاء إدخال الرمز والرابط!';
        return;
    }

    statusDiv.style.color = '#f1c40f';
    statusDiv.innerText = 'جاري التحديث...';

    // معلومات المستودع الخاص بك
    const owner = 'xte1'; 
    const repo = 'Tre';
    const path = 'link.txt';

    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

    try {
        // 1. جلب الـ SHA القديم للملف
        const getRes = await fetch(url, {
            headers: { 'Authorization': `token ${token}` }
        });
        
        let sha = '';
        if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
        }

        // 2. تحديث الملف بالمحتوى الجديد مباشرة
        const putRes = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                message: 'Update target link via web interface',
                content: btoa(unescape(encodeURIComponent(content))),
                sha: sha || undefined
            })
        });

        if (putRes.ok) {
            statusDiv.style.color = '#2ecc71';
            statusDiv.innerText = 'تم تحديث الرابط بنجاح داخل السكريبت!';
        } else {
            const errData = await putRes.json();
            throw new Error(errData.message || 'فشل التحديث');
        }
    } catch (error) {
        statusDiv.style.color = '#ff6b6b';
        statusDiv.innerText = 'خطأ: ' + error.message;
    }
}
</script>

</body>
</html>
